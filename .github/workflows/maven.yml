# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Install JavaFX system dependencies (Linux headless)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-3-0 \
          libxtst6 \
          libxrender1 \
          libxi6 \
          libgl1 \
          libglx-mesa0 \
          libglib2.0-0 \
          xvfb

    - name: Build with Maven
      run: mvn -B package --file pom.xml
      env:
        # Utile pour tout test JavaFX qui aurait besoin d'un display
        DISPLAY: ":99"

    # Upload du fat jar livrable en artefact (optionnel mais utile)
    - name: Upload fat jar artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: gradebook-fat-jar
        path: target/gradebook-*-fat.jar
        if-no-files-found: warn

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@v4
